name: Build Web

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Testes (parser, guessType, i18n, estrutura)
        run: node --test web/tests/*.js

      - name: Smoke tests (Chrome headless)
        run: |
          CHROME=$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)
          if [ -z "$CHROME" ]; then
            echo "::error::Nenhum Chrome/Chromium encontrado no runner"
            exit 1
          fi
          echo "Chrome: $CHROME"
          python3 serve.py >/dev/null 2>&1 &
          SERVER_PID=$!
          sleep 3
          status=0
          for page in browser-smoke.html browser-smoke-board.html; do
            budget=30000; [ "$page" = "browser-smoke-board.html" ] && budget=90000
            # --disable-dev-shm-usage: /dev/shm pequeno nos runners quebra o Chrome
            "$CHROME" --headless --disable-gpu --no-sandbox --disable-dev-shm-usage \
              --virtual-time-budget=$budget --dump-dom \
              "http://localhost:8000/web/tests/$page" > "/tmp/$page.out" 2>"/tmp/$page.err" || true
            # Extrai SÓ o bloco de resultado: o dump inclui o <script> da página,
            # que contém as strings "PASS"/"FAIL" (grep no dump inteiro dá falso positivo).
            sed -n '/<pre id="out">/,/<\/pre>/p' "/tmp/$page.out" | sed 's/<[^>]*>//g' > "/tmp/$page.result"
            if grep -qE "^FAIL" "/tmp/$page.result"; then
              echo "::error::$page com FAIL"
              sed 's/^/   /' "/tmp/$page.result"
              status=1
            elif ! grep -q "SMOKE-DONE" "/tmp/$page.result"; then
              echo "::error::$page não terminou (stderr:)"
              tail -5 "/tmp/$page.err" | sed 's/^/   /'
              status=1
            else
              echo "✅ $page ($(grep -cE '^PASS' "/tmp/$page.result") checks)"
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          exit $status

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Empacotar zip web (sem arquivos de dev)
        run: |
          cd web
          zip -r ../Fonte-web.zip . \
            -x "tests/*" \
            -x "server.py" \
            -x "fountain_utils.py" \
            -x "__pycache__/*" \
            -x "test-excalidraw.html" \
            -x "docker-compose.yml" \
            -x "Dockerfile"
          cd ..
      - uses: actions/upload-artifact@v7
        with:
          name: Fonte-web
          path: Fonte-web.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: _artifacts
      - name: Coletar zip web
        run: |
          mkdir -p _release
          # Procura o zip em qualquer nível (o layout dos artefatos varia
          # entre versões da action) — antes era um caminho fixo e quebrou.
          find _artifacts -name 'Fonte-web.zip' -exec cp {} _release/ \;
          ls -la _release/
      - uses: softprops/action-gh-release@v3
        with:
          files: _release/*
          body_path: CHANGELOG.md
          make_latest: true
