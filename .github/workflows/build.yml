name: Build Web

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Testes (parser, guessType, i18n, estrutura)
        run: node --test web/tests/*.js

      - name: Smoke tests (Chrome headless)
        run: |
          python3 serve.py >/dev/null 2>&1 &
          SERVER_PID=$!
          sleep 2
          status=0
          for page in browser-smoke.html browser-smoke-board.html; do
            budget=30000; [ "$page" = "browser-smoke-board.html" ] && budget=60000
            google-chrome --headless=new --disable-gpu --no-sandbox \
              --virtual-time-budget=$budget --dump-dom \
              "http://localhost:8000/web/tests/$page" > "/tmp/$page.out" 2>/dev/null || true
            if grep -q "FAIL" "/tmp/$page.out"; then
              echo "❌ $page"
              grep -oE "(PASS|FAIL)[^<]*" "/tmp/$page.out" | sed 's/^/   /'
              status=1
            elif ! grep -q "SMOKE-DONE" "/tmp/$page.out"; then
              echo "❌ $page não terminou"
              status=1
            else
              echo "✅ $page"
            fi
          done
          kill $SERVER_PID 2>/dev/null || true
          exit $status

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Empacotar zip web (sem arquivos de dev)
        run: |
          cd web
          zip -r ../Fonte-web.zip . \
            -x "tests/*" \
            -x "server.py" \
            -x "fountain_utils.py" \
            -x "__pycache__/*" \
            -x "test-excalidraw.html" \
            -x "docker-compose.yml" \
            -x "Dockerfile"
          cd ..
      - uses: actions/upload-artifact@v7
        with:
          name: Fonte-web
          path: Fonte-web.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: _artifacts
      - name: Coletar zip web
        run: |
          mkdir -p _release
          # Procura o zip em qualquer nível (o layout dos artefatos varia
          # entre versões da action) — antes era um caminho fixo e quebrou.
          find _artifacts -name 'Fonte-web.zip' -exec cp {} _release/ \;
          ls -la _release/
      - uses: softprops/action-gh-release@v3
        with:
          files: _release/*
          body_path: CHANGELOG.md
          make_latest: true
