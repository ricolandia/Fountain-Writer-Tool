name: Build Web

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Testes (parser, guessType, i18n, estrutura)
        run: node --test web/tests/*.js

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Empacotar zip web (sem arquivos de dev)
        run: |
          cd web
          zip -r ../Fonte-web.zip . \
            -x "tests/*" \
            -x "server.py" \
            -x "fountain_utils.py" \
            -x "__pycache__/*" \
            -x "test-excalidraw.html" \
            -x "docker-compose.yml" \
            -x "Dockerfile"
          cd ..
      - uses: actions/upload-artifact@v7
        with:
          name: Fonte-web
          path: Fonte-web.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: _artifacts
      - name: Coletar zip web
        run: |
          mkdir -p _release
          # Procura o zip em qualquer nível (o layout dos artefatos varia
          # entre versões da action) — antes era um caminho fixo e quebrou.
          find _artifacts -name 'Fonte-web.zip' -exec cp {} _release/ \;
          ls -la _release/
      - uses: softprops/action-gh-release@v3
        with:
          files: _release/*
          body_path: CHANGELOG.md
          make_latest: true
