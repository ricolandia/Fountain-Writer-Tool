name: Build Web

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Testes (parser, guessType, i18n, estrutura)
        run: node --test web/tests/*.js

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Empacotar zip web (sem arquivos de dev)
        run: |
          cd web
          zip -r ../Fonte-web.zip . \
            -x "tests/*" \
            -x "server.py" \
            -x "fountain_utils.py" \
            -x "__pycache__/*" \
            -x "test-excalidraw.html" \
            -x "docker-compose.yml" \
            -x "Dockerfile"
          cd ..
      - uses: actions/upload-artifact@v5
        with:
          name: Fonte-web
          path: Fonte-web.zip

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v5
      - run: |
          mkdir -p _release
          cp Fonte-web/Fonte-web.zip _release/
      - uses: softprops/action-gh-release@v2
        with:
          files: _release/*
          body_path: CHANGELOG.md
          make_latest: true
