name: Build Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Fonte-linux
            exe_name: Fonte
          - os: windows-latest
            artifact: Fonte-windows
            exe_name: Fonte.exe
          - os: macos-latest
            artifact: Fonte-macos
            exe_name: Fonte.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install PySide6 pyinstaller

      - name: Build (PyInstaller)
        run: pyinstaller desktop/fonte.spec --distpath dist --workpath build --noconfirm

      - name: Sanidade (Linux headless)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          # Libs de sistema que o QtWebEngine pode precisar no runner
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libxkbcommon-x11-0 libasound2t64 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libpci3 libegl1 >/dev/null 2>&1 || true
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox" timeout 12 ./dist/Fonte/${{ matrix.exe_name }} &
          sleep 8
          if kill -0 $! 2>/dev/null; then echo "App iniciou sem crash ✅"; kill $!; else echo "App não iniciou no runner (não bloqueia) ⚠️"; fi

      - name: Upload artefato
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/Fonte
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Empacotar releases
        run: |
          python3 - <<'EOF'
          import zipfile, os
          os.makedirs('_release', exist_ok=True)
          # Zip web universal (web/)
          def zip_dir(src, dst, exclude=()):
              with zipfile.ZipFile(dst, 'w', zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in os.walk(src):
                      for f in files:
                          if f in exclude:
                              continue
                          p = os.path.join(root, f)
                          z.write(p, os.path.relpath(p, src))
          zip_dir('web', '_release/Fonte-web.zip',
                  exclude={'docker-compose.yml', 'Dockerfile', 'test-excalidraw.html'})
          # Zips por plataforma (artifacts/<nome>/...)
          for name in ('Fonte-linux', 'Fonte-windows', 'Fonte-macos'):
              src = os.path.join('artifacts', name)
              if os.path.isdir(src):
                  zip_dir(src, f'_release/{name}.zip')
          print('Empacotado:', os.listdir('_release'))
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: _release/*
          body_path: CHANGELOG.md
          make_latest: true
