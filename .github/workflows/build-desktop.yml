name: Build Desktop

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: Fonte-linux
            exe_name: Fonte
          - os: windows-latest
            artifact: Fonte-windows
            exe_name: Fonte.exe
          - os: macos-latest
            artifact: Fonte-macos
            exe_name: Fonte.app

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Instalar dependências
        run: pip install PySide6 pyinstaller

      - name: Build (PyInstaller)
        run: pyinstaller desktop/fonte.spec --distpath dist --workpath build --noconfirm

      - name: Sanidade (Linux headless)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          # Libs de sistema que o QtWebEngine pode precisar no runner
          sudo apt-get update -qq
          sudo apt-get install -y -qq libnss3 libxkbcommon-x11-0 libasound2t64 libgbm1 libxcomposite1 libxdamage1 libxrandr2 libxtst6 libpci3 libegl1 >/dev/null 2>&1 || true
          # Verificação 1: permissão de execução do QtWebEngineProcess no bundle
          WEP="./dist/Fonte/_internal/PySide6/Qt/libexec/QtWebEngineProcess"
          if [ -x "$WEP" ]; then echo "QtWebEngineProcess executável ✅"; else echo "QtWebEngineProcess SEM +x ⚠️"; ls -la "$WEP" || echo "  (caminho não encontrado)"; fi
          # Verificação 2: app sobe e o processo QtWebEngineProcess é criado
          QT_QPA_PLATFORM=offscreen QTWEBENGINE_CHROMIUM_FLAGS="--disable-gpu --no-sandbox" timeout 15 ./dist/Fonte/${{ matrix.exe_name }} &
          APP_PID=$!
          sleep 10
          if kill -0 $APP_PID 2>/dev/null; then
            if pgrep -f 'QtWebEngineProcess' >/dev/null; then
              echo "App iniciou + QtWebEngineProcess ativo ✅"
            else
              echo "App vivo mas QtWebEngineProcess NÃO subiu ⚠️ (provável problema de exec/permissão)"
            fi
            kill $APP_PID
          else
            echo "App não iniciou no runner (não bloqueia) ⚠️"
          fi

      - name: Upload artefato
        uses: actions/upload-artifact@v5
        with:
          name: ${{ matrix.artifact }}
          path: dist/Fonte
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts

      - name: Empacotar releases
        run: |
          python3 - <<'EOF'
          import zipfile, os
          os.makedirs('_release', exist_ok=True)
          # Zip web universal (web/ → Fonte-web.zip)
          with zipfile.ZipFile('_release/Fonte-web.zip', 'w', zipfile.ZIP_DEFLATED) as z:
              for root, _, files in os.walk('web'):
                  for f in files:
                      if f in ('docker-compose.yml', 'Dockerfile', 'test-excalidraw.html'):
                          continue
                      p = os.path.join(root, f)
                      z.write(p, os.path.relpath(p, 'web'))
          # Zips por plataforma — cada um dentro de uma pasta Fonte/ (organizado)
          for name in ('Fonte-linux', 'Fonte-windows', 'Fonte-macos'):
              src = os.path.join('artifacts', name)
              if not os.path.isdir(src):
                  print(f'⚠️  Artefato ausente: {src}')
                  continue
              with zipfile.ZipFile(f'_release/{name}.zip', 'w', zipfile.ZIP_DEFLATED) as z:
                  for root, _, files in os.walk(src):
                      for f in files:
                          p = os.path.join(root, f)
                          # Prefixo 'Fonte/' — extrai organizado numa pasta
                          z.write(p, os.path.join('Fonte', os.path.relpath(p, src)))
          print('Empacotado:', os.listdir('_release'))
          EOF

      - uses: softprops/action-gh-release@v2
        with:
          files: _release/*
          body_path: CHANGELOG.md
          make_latest: true
